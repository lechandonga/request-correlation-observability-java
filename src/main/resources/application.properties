# Ephemeral port by default; override with --server.port=8080 for local runs.
server.port=0

# Every log line carries the correlation id of the request/task being handled
# (empty when the thread is not bound to any correlation scope).
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%thread] [corr=%X{correlationId:-}] %logger{36} - %msg%n

# A request is "slow" when it takes at least this long (milliseconds).
observability.slow-threshold-ms=1000

# Demo heartbeat scheduled task (off by default).
observability.heartbeat.enabled=false
observability.heartbeat.interval-ms=60000

# Let 404s flow through the central exception handler so they get a
# correlation-tagged, safe error body as well.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
